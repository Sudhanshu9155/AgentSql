services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - agentsql-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/agentsql
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: 8h
      AGENT_URL: http://agent:8000
    depends_on:
      - mongo
    networks:
      - agentsql-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - agentsql-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
      - agent
    networks:
      - agentsql-net

networks:
  agentsql-net:
    driver: bridge

volumes:
  mongo-data:
