services:
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - agentsql-net

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agentsql
      MYSQL_USER: agentsql
      MYSQL_PASSWORD: agentsql123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - agentsql-net

  server:
    image: ${AWS_ACCOUNT_ID:-local}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/agentsql-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/agentsql
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: 8h
      AGENT_URL: http://agent:8000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      - mongo
    networks:
      - agentsql-net

  agent:
    image: ${AWS_ACCOUNT_ID:-local}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/agentsql-agent:latest
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - agentsql-net

  client:
    image: ${AWS_ACCOUNT_ID:-local}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/agentsql-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - server
      - agent
    networks:
      - agentsql-net

networks:
  agentsql-net:
    driver: bridge

volumes:
  mongo-data:
  mysql-data:
