name: 🚀 Build, Push & Deploy AgentSQL

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker images to ECR
  # ─────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push CLIENT image
        working-directory: ./client
        run: |
          docker build -t $ECR_REGISTRY/agentsql-client:latest \
                       -t $ECR_REGISTRY/agentsql-client:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-client:latest
          docker push $ECR_REGISTRY/agentsql-client:${{ github.sha }}

      - name: 🐳 Build & Push SERVER image
        working-directory: ./server
        run: |
          docker build -t $ECR_REGISTRY/agentsql-server:latest \
                       -t $ECR_REGISTRY/agentsql-server:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-server:latest
          docker push $ECR_REGISTRY/agentsql-server:${{ github.sha }}

      - name: 🐳 Build & Push AGENT image
        working-directory: ./agent
        run: |
          docker build -t $ECR_REGISTRY/agentsql-agent:latest \
                       -t $ECR_REGISTRY/agentsql-agent:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-agent:latest
          docker push $ECR_REGISTRY/agentsql-agent:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 2: Deploy to EC2 via SSH
  # ─────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/agentsql/"

      - name: 🚀 SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }},AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }},AWS_DEFAULT_REGION=ap-south-1,AWS_REGION=ap-south-1,AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          script: |
            set -e
            mkdir -p ~/agentsql
            cd ~/agentsql

            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION AWS_REGION AWS_ACCOUNT_ID

            cat > .env <<EOF
            AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
            AWS_REGION=${AWS_REGION}
            JWT_SECRET=change-me
            JWT_EXPIRES_IN=8h
            MONGO_URI=mongodb://mongo:27017/agentsql
            AGENT_URL=http://agent:8000
            EOF

            if ! command -v aws >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y unzip curl
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
            fi

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            sudo usermod -aG docker ubuntu || true

            # Authenticate Docker with ECR
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

            # Pull the latest images
            docker compose --env-file .env pull

            # Restart changed containers only
            docker compose --env-file .env up -d --remove-orphans

            # Clean up dangling images
            docker image prune -f

            echo "✅ Deployment complete!"
