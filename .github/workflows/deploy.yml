name: Deploy AgentSQL to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s
          command_timeout: 600s
          script: |
            set -e

            echo "=============================================="
            echo "  AgentSQL Deployment Starting"
            echo "=============================================="

            # ── STEP 1: Install Node.js 20 ─────────────────────────────────────
            if ! command -v node &>/dev/null; then
              echo "[1/8] Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
              echo "      Node.js $(node --version) installed"
            else
              echo "[1/8] Node.js already installed: $(node --version)"
            fi

            # ── STEP 2: Install Python 3.12 via uv ────────────────────────────
            # uv downloads Python from its own CDN — works on ANY Ubuntu version.
            # NO apt/PPA needed. Avoids Python 3.14 incompatibility with
            # pydantic-core (PyO3 max=3.13) and pandas.
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

            if ! command -v uv &>/dev/null; then
              echo "[2/8] Installing uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              echo "      uv $(uv --version) installed"
            else
              echo "[2/8] uv already installed: $(uv --version)"
            fi

            # Install Python 3.12 (uv downloads its own binaries, no apt needed)
            echo "      Installing Python 3.12 via uv..."
            uv python install 3.12

            # Create isolated venv with Python 3.12
            echo "      Creating Python 3.12 venv..."
            uv venv --allow-existing --python 3.12 ~/agentsql-venv
            echo "      Venv ready: ~/agentsql-venv ($(~/agentsql-venv/bin/python --version))"

            # ── STEP 3: Install PM2 ────────────────────────────────────────────
            if ! command -v pm2 &>/dev/null; then
              echo "[3/8] Installing PM2..."
              sudo npm install -g pm2
              echo "      PM2 $(pm2 --version) installed"
            else
              echo "[3/8] PM2 already installed: $(pm2 --version)"
            fi

            # ── STEP 4: Install and configure Nginx ───────────────────────────
            if ! command -v nginx &>/dev/null; then
              echo "[4/8] Installing Nginx..."
              sudo apt-get install -y nginx
              sudo systemctl enable nginx
              sudo systemctl start nginx
              echo "      Nginx installed"
            else
              echo "[4/8] Nginx already installed"
            fi

            sudo mkdir -p /var/www/agentsql

            cat << 'NGINXEOF' | sed 's/^[ \t]*//' | sudo tee /etc/nginx/sites-available/agentsql > /dev/null
            server {
                listen 80;
                server_name _;

                root /var/www/agentsql;
                index index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
            }
            NGINXEOF

            sudo ln -sf /etc/nginx/sites-available/agentsql /etc/nginx/sites-enabled/agentsql
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx
            echo "      Nginx configured and reloaded"

            # ── STEP 4.5: Install and configure MySQL ──────────────────────────
            if ! command -v mysql &>/dev/null; then
              echo "[4.5/8] Installing MySQL Server..."
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get install -y mysql-server
              sudo systemctl enable mysql
              sudo systemctl start mysql
              echo "      MySQL installed"
            else
              echo "[4.5/8] MySQL already installed"
            fi

            echo "      Configuring default AgentSQL database..."
            sudo mysql -u root <<-MYSQLEOF
            CREATE DATABASE IF NOT EXISTS agentsql;
            CREATE DATABASE IF NOT EXISTS smart_city;
            CREATE USER IF NOT EXISTS 'agentsql'@'localhost' IDENTIFIED BY 'agentsql123';
            CREATE USER IF NOT EXISTS 'agentsql'@'127.0.0.1' IDENTIFIED BY 'agentsql123';
            CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'password';
            GRANT ALL PRIVILEGES ON agentsql.* TO 'agentsql'@'localhost';
            GRANT ALL PRIVILEGES ON agentsql.* TO 'agentsql'@'127.0.0.1';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1';
            FLUSH PRIVILEGES;
            MYSQLEOF
            echo "      Default local database configured (agentsql/agentsql123)"

            # ── STEP 5: Clone or pull latest code ─────────────────────────────
            if [ ! -d "$HOME/agentsql/.git" ]; then
              echo "[5/8] Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git ~/agentsql
            else
              echo "[5/8] Pulling latest code..."
              cd ~/agentsql
              git fetch origin
              git reset --hard origin/main
            fi

            cd ~/agentsql

            # ── STEP 6: Write .env from GitHub Secrets ────────────────────────
            echo "[6/8] Writing .env file..."
            cat << 'ENVEOF' | sed 's/^[ \t]*//' > .env
            PORT=3001
            AGENT_URL=http://127.0.0.1:8000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=8h
            MONGO_URI=${{ secrets.MONGO_URI }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF
            echo "      .env written"

            # ── STEP 7: Install dependencies and build ────────────────────────
            echo "[7/8] Installing dependencies and building..."

            echo "      Installing server dependencies..."
            cd ~/agentsql/server
            npm ci --omit=dev

            echo "      Installing agent dependencies (Python 3.12 venv)..."
            cd ~/agentsql/agent
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            export VIRTUAL_ENV="$HOME/agentsql-venv"
            uv pip install -r requirements.txt --quiet
            echo "      Agent dependencies installed successfully"

            echo "      Building React client..."
            cd ~/agentsql/client
            npm ci
            npm run build

            echo "      Copying build to Nginx web root..."
            sudo cp -r ~/agentsql/client/dist/* /var/www/agentsql/
            echo "      Client deployed to /var/www/agentsql"

            # ── STEP 8: Start or reload services via PM2 ──────────────────────
            echo "[8/8] Starting/reloading services with PM2..."
            cd ~/agentsql
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

            if pm2 list | grep -q "agentsql-server"; then
              pm2 reload ecosystem.config.js --update-env
              echo "      Services reloaded (zero downtime)"
            else
              pm2 start ecosystem.config.js
              pm2 save
              sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true
              pm2 save
              echo "      Services started and saved"
            fi

            pm2 status

            echo ""
            echo "=============================================="
            echo "  Deployment Complete!"
            echo "  Frontend : http://${{ secrets.EC2_HOST }}/"
            echo "  API      : http://${{ secrets.EC2_HOST }}:3001/api/health"
            echo "  Agent    : http://${{ secrets.EC2_HOST }}:8000/docs"
            echo "=============================================="
