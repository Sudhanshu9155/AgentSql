name: 🚀 Build, Push & Deploy AgentSQL

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '074086641262' }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID || '074086641262' }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker images to ECR
  # ─────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push CLIENT image
        working-directory: ./client
        run: |
          docker build -t $ECR_REGISTRY/agentsql-client:latest \
                       -t $ECR_REGISTRY/agentsql-client:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-client:latest
          docker push $ECR_REGISTRY/agentsql-client:${{ github.sha }}

      - name: 🐳 Build & Push SERVER image
        working-directory: ./server
        run: |
          docker build -t $ECR_REGISTRY/agentsql-server:latest \
                       -t $ECR_REGISTRY/agentsql-server:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-server:latest
          docker push $ECR_REGISTRY/agentsql-server:${{ github.sha }}

      - name: 🐳 Build & Push AGENT image
        working-directory: ./agent
        run: |
          docker build -t $ECR_REGISTRY/agentsql-agent:latest \
                       -t $ECR_REGISTRY/agentsql-agent:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-agent:latest
          docker push $ECR_REGISTRY/agentsql-agent:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 2: Deploy to EC2 via SSH
  # ─────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: � Create AWS credentials file
        run: |
          cat > aws-creds.env <<EOF
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          AWS_REGION=${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID=${{ env.AWS_ACCOUNT_ID }}
          EOF

      - name: 📋 Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,aws-creds.env"
          target: "~/agentsql/"

      - name: 🚀 SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/agentsql
            cd ~/agentsql

            # Load AWS credentials from file and export them for child processes
            if [ -f aws-creds.env ]; then
              set -a
              . ./aws-creds.env
              set +a
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION AWS_REGION AWS_ACCOUNT_ID
            else
              echo "ERROR: aws-creds.env not found"
              exit 1
            fi

            echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID"
            echo "AWS_REGION=$AWS_REGION"
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:+set}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:+set}"

            if [ -z "$AWS_ACCOUNT_ID" ] || [ -z "$AWS_REGION" ]; then
              echo "AWS_ACCOUNT_ID or AWS_REGION is missing"
              exit 1
            fi

            if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
              echo "AWS access keys are missing on the EC2 host"
              exit 1
            fi

            REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

            if [ -z "${{ secrets.ENCRYPTION_KEY }}" ]; then
              echo "ERROR: GitHub secret ENCRYPTION_KEY is missing"
              exit 1
            fi

            cat > .env <<EOF
            AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
            AWS_REGION=${AWS_REGION}
            JWT_SECRET=change-me
            JWT_EXPIRES_IN=8h
            MONGO_URI=mongodb://mongo:27017/agentsql
            AGENT_URL=http://agent:8000
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            EOF

            if ! command -v aws >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y unzip curl
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install -i /usr/local/aws-cli -b /usr/local/bin
            fi

            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-plugin
              sudo systemctl enable docker || true
              sudo systemctl start docker || true
              sudo service docker start || true
            fi

            # Authenticate Docker with ECR
            aws ecr get-login-password --region "$AWS_REGION" | \
              sudo docker login --username AWS --password-stdin \
              "$REGISTRY"

            # Pull the latest images
            sudo docker compose --env-file .env pull

            # Restart changed containers only
            sudo docker compose --env-file .env up -d --remove-orphans

            # Clean up dangling images
            sudo docker image prune -f

            # Cleanup
            rm -f aws-creds.env

            echo "✅ Deployment complete!"
