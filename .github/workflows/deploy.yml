name: 🚀 Build, Push & Deploy AgentSQL

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Push Docker images to ECR
  # ─────────────────────────────────────────
  build-and-push:
    name: 🏗️ Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push CLIENT image
        working-directory: ./client
        run: |
          docker build -t $ECR_REGISTRY/agentsql-client:latest \
                       -t $ECR_REGISTRY/agentsql-client:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-client:latest
          docker push $ECR_REGISTRY/agentsql-client:${{ github.sha }}

      - name: 🐳 Build & Push SERVER image
        working-directory: ./server
        run: |
          docker build -t $ECR_REGISTRY/agentsql-server:latest \
                       -t $ECR_REGISTRY/agentsql-server:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-server:latest
          docker push $ECR_REGISTRY/agentsql-server:${{ github.sha }}

      - name: 🐳 Build & Push AGENT image
        working-directory: ./agent
        run: |
          docker build -t $ECR_REGISTRY/agentsql-agent:latest \
                       -t $ECR_REGISTRY/agentsql-agent:${{ github.sha }} .
          docker push $ECR_REGISTRY/agentsql-agent:latest
          docker push $ECR_REGISTRY/agentsql-agent:${{ github.sha }}

  # ─────────────────────────────────────────
  # JOB 2: Deploy to EC2 via SSH
  # ─────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/agentsql/"

      - name: 🚀 SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/agentsql

            # Authenticate Docker with ECR
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

            # Pull the latest images
            docker compose pull

            # Restart changed containers only
            docker compose up -d --remove-orphans

            # Clean up dangling images
            docker image prune -f

            echo "✅ Deployment complete!"
