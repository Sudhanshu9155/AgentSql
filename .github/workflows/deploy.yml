name: Deploy AgentSQL to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s
          command_timeout: 600s
          script: |
            set -e

            echo "=============================================="
            echo "  AgentSQL Deployment Starting"
            echo "=============================================="

            # ── STEP 1: Install Node.js 20 if not present ─────────────────────
            if ! command -v node &>/dev/null; then
              echo "[1/8] Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - 2>/dev/null
              sudo apt-get install -y nodejs 2>/dev/null
              echo "      Node.js $(node --version) installed"
            else
              echo "[1/8] Node.js already installed: $(node --version)"
            fi

            # ── STEP 2: Install Python 3.12 (NOT system 3.14) ─────────────────
            # Ubuntu 26.04 ships Python 3.14 — too new for pydantic-core/pandas.
            # Use deadsnakes PPA to get Python 3.12 (stable, fully supported).
            if ! command -v python3.12 &>/dev/null; then
              echo "[2/8] Installing Python 3.12 via deadsnakes PPA..."
              sudo apt-get install -y software-properties-common 2>/dev/null
              sudo add-apt-repository ppa:deadsnakes/ppa -y 2>/dev/null
              sudo apt-get update -y 2>/dev/null
              sudo apt-get install -y python3.12 python3.12-venv python3.12-dev build-essential 2>/dev/null
              echo "      Python $(python3.12 --version) installed"
            else
              echo "[2/8] Python 3.12 already installed: $(python3.12 --version)"
            fi

            # Create/update isolated venv using Python 3.12
            echo "      Creating Python 3.12 venv for agent..."
            python3.12 -m venv ~/agentsql-venv
            echo "      Venv ready at ~/agentsql-venv"


            # ── STEP 3: Install PM2 if not present ────────────────────────────
            if ! command -v pm2 &>/dev/null; then
              echo "[3/8] Installing PM2..."
              sudo npm install -g pm2 2>/dev/null
              echo "      PM2 $(pm2 --version) installed"
            else
              echo "[3/8] PM2 already installed: $(pm2 --version)"
            fi

            # ── STEP 4: Install and configure Nginx if not present ────────────
            if ! command -v nginx &>/dev/null; then
              echo "[4/8] Installing Nginx..."
              sudo apt-get install -y nginx 2>/dev/null
              sudo systemctl enable nginx
              sudo systemctl start nginx
              echo "      Nginx installed"
            else
              echo "[4/8] Nginx already installed"
            fi

            # Create Nginx web root for React
            sudo mkdir -p /var/www/agentsql

            # Write Nginx site config (always overwrite to keep it updated)
            sudo tee /etc/nginx/sites-available/agentsql > /dev/null << 'NGINXEOF'
            server {
                listen 80;
                server_name _;

                root /var/www/agentsql;
                index index.html;

                # React SPA fallback
                location / {
                    try_files $uri $uri/ /index.html;
                }

                # Proxy API to Node.js server
                location /api/ {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }
            }
            NGINXEOF

            # Enable site, disable default
            sudo ln -sf /etc/nginx/sites-available/agentsql /etc/nginx/sites-enabled/agentsql
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl reload nginx
            echo "      Nginx configured and reloaded"

            # ── STEP 5: Clone or pull latest code ─────────────────────────────
            if [ ! -d "$HOME/agentsql/.git" ]; then
              echo "[5/8] Cloning repository for the first time..."
              git clone https://github.com/${{ github.repository }}.git ~/agentsql
            else
              echo "[5/8] Pulling latest code..."
              cd ~/agentsql
              git fetch origin
              git reset --hard origin/main
            fi

            cd ~/agentsql

            # ── STEP 6: Write .env from GitHub Secrets ────────────────────────
            echo "[6/8] Writing .env file..."
            cat > .env << ENVEOF
            PORT=3001
            AGENT_URL=http://127.0.0.1:8000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=8h
            MONGO_URI=${{ secrets.MONGO_URI }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF
            echo "      .env written"

            # ── STEP 7: Install dependencies and build ────────────────────────
            echo "[7/8] Installing dependencies and building..."

            echo "      Installing server dependencies..."
            cd ~/agentsql/server
            npm ci --omit=dev

            echo "      Installing agent dependencies into Python 3.12 venv..."
            cd ~/agentsql/agent
            # Use the venv pip — fully isolated from system Python 3.14
            ~/agentsql-venv/bin/pip install --upgrade pip --quiet
            ~/agentsql-venv/bin/pip install -r requirements.txt --quiet --prefer-binary
            echo "      Agent dependencies installed"

            echo "      Building React client..."
            cd ~/agentsql/client
            npm ci
            npm run build

            echo "      Copying build to Nginx web root..."
            sudo cp -r ~/agentsql/client/dist/* /var/www/agentsql/
            echo "      Client deployed to /var/www/agentsql"

            # ── STEP 8: Start or reload services via PM2 ──────────────────────
            echo "[8/8] Starting/reloading services with PM2..."
            cd ~/agentsql

            if pm2 list | grep -q "agentsql-server"; then
              # Services already running — zero-downtime reload
              pm2 reload ecosystem.config.js --update-env
              echo "      Services reloaded"
            else
              # First time — start fresh
              pm2 start ecosystem.config.js
              pm2 save
              # Enable PM2 to auto-start on server reboot
              sudo env PATH=$PATH:/usr/bin pm2 startup systemd -u ubuntu --hp /home/ubuntu || true
              pm2 save
              echo "      Services started and saved"
            fi

            pm2 status

            echo ""
            echo "=============================================="
            echo "  Deployment Complete!"
            echo "  Frontend : http://${{ secrets.EC2_HOST }}/"
            echo "  API      : http://${{ secrets.EC2_HOST }}:3001/api/health"
            echo "  Agent    : http://${{ secrets.EC2_HOST }}:8000/docs"
            echo "=============================================="
